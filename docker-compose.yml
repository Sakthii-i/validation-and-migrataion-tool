services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  trino:
    image: trinodb/trino:latest
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog

  api:
    build:
      context: ..
      dockerfile: validation_tool/Dockerfile
    command: ["python", "-m", "uvicorn", "validation_tool.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VALIDATION_SESSION_TTL_SECONDS=3600
      - VALIDATION_API_KEYS=dev-key
      - CREDENTIAL_PASSWORD=${CREDENTIAL_PASSWORD:?CREDENTIAL_PASSWORD is required}
      - BQ_KEY_PATH=${BQ_KEY_PATH:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_RESULTS_TABLE=${SUPABASE_RESULTS_TABLE:-validation_results}
      - SUPABASE_JOBS_TABLE=${SUPABASE_JOBS_TABLE:-validation_jobs}
      - SUPABASE_AUTH_TABLE=${SUPABASE_AUTH_TABLE:-auth_credentials}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - ADMIN_SMTP_PASSWORD=${ADMIN_SMTP_PASSWORD:-}
      - TRINO_HOST=${TRINO_HOST:-trino}
      - TRINO_PORT=${TRINO_PORT:-8080}
      - TRINO_USER=${TRINO_USER:-admin}
      - TRINO_HTTP_SCHEME=${TRINO_HTTP_SCHEME:-http}
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - trino
    volumes:
      - ..:/app

  worker:
    build:
      context: ..
      dockerfile: validation_tool/Dockerfile
    command: ["python", "-m", "validation_tool.worker.run_worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VALIDATION_SESSION_TTL_SECONDS=3600
      - VALIDATION_API_KEYS=dev-key
      - CREDENTIAL_PASSWORD=${CREDENTIAL_PASSWORD:?CREDENTIAL_PASSWORD is required}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_RESULTS_TABLE=${SUPABASE_RESULTS_TABLE:-validation_results}
      - SUPABASE_JOBS_TABLE=${SUPABASE_JOBS_TABLE:-validation_jobs}
      - SUPABASE_AUTH_TABLE=${SUPABASE_AUTH_TABLE:-auth_credentials}
      - TRINO_HOST=${TRINO_HOST:-trino}
      - TRINO_PORT=${TRINO_PORT:-8080}
      - TRINO_USER=${TRINO_USER:-admin}
      - TRINO_HTTP_SCHEME=${TRINO_HTTP_SCHEME:-http}
    depends_on:
      - redis
      - trino

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
#    volumes:
#      - ./frontend:/app
#      - /app/node_modules
